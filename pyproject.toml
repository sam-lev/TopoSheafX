# pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toposheafx"
version = "0.1.0"
description = "Copresheaf Topological Neural Networks (CMPNN/CHOMPNN) - message passing on combinatorial complexes"
authors = [{name = "TopoSheafX Team"}]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0,<2.4.0",
    "torch-geometric>=2.3.0",
    "torch-scatter>=2.1.0",
    "numpy>=1.21.0,<2.0.0",
    "scipy>=1.7.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pylint>=2.17.0",
    "bandit>=1.7.0",
    "radon>=6.0.0",
]

docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-autodoc-typehints>=1.22.0",
]

test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.0.0",
]

[project.scripts]
cmpnn-train = "scripts.train_model:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["toposheafx*"]
exclude = ["tests*", "docs*", "examples*", "data*"]

[tool.setuptools.package-data]
toposheafx = ["*.yaml", "*.yml", "*.json"]

# Ruff configuration - Updated to new structure
[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "N812",   # lowercase imported as non-lowercase (for F = torch.nn.functional)
    "E731",   # do not assign lambda expressions (sometimes needed)
    "W291",   # trailing whitespace (handled by formatter)
    "SIM108", # use ternary operator (sometimes less readable)
]

[tool.ruff.lint.per-file-ignores]
# Test files can have different conventions
"tests/*" = [
    "E402",  # module import not at top of file
    "F401",  # unused imports (fixtures)
    "F811",  # redefinition of unused variable
    "N803",  # argument name should be lowercase (for parametrize)
    "N999",  # invalid module name
    "B007",  # unused loop variable
]
"__init__.py" = ["F401", "E402"]  # unused imports and import order
"tests/__init__.py" = ["N999", "W292"]  # module name and newline
"*/migrations/*" = ["E501"]  # line length in migrations
"docs/*" = ["E402"]  # import order in docs

# Allow certain variable names that are common in scientific computing
[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "validator"]
staticmethod-decorators = ["staticmethod"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | __pycache__
  | build
  | dist
  | .venv
  | venv
  | \.egg-info
  | \.pytest_cache
  | \.mypy_cache
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["toposheafx"]
known_third_party = ["torch", "torch_geometric", "torch_scatter", "numpy", "scipy"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "build/",
    "dist/",
    "tests/",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = """
    -ra
    --strict-markers
    --ignore=docs
    --ignore=setup.py
    --ignore=ci
    --ignore=.eggs
    --doctest-modules
    --tb=short
    --cov=toposheafx
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-branch
"""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: marks integration tests",
    "unit: marks unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["toposheafx"]
branch = true
relative_files = true  # Critical for CI/CD
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/setup.py",
    "*/conf.py",
    "*/docs/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2
skip_covered = false
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0903",  # too-few-public-methods
    "W0212",  # protected-access
    "E1101",  # no-member (false positives with torch)
    "W0622",  # redefined-builtin
    "R0801",  # duplicate-code
]

[tool.pylint.format]
max-line-length = 100

[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101", "B601"]  # assert_used, shell_with_subprocess