# .github/workflows/lint.yml
name: Lint and Code Quality

on:
  push:
    branches: [ "sam", "main" ]
  pull_request:
    branches: [ "sam", "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy

      - name: Run ruff linter
        run: |
          ruff check . --output-format=github

      - name: Check code formatting with black
        run: |
          black --check --diff .

      - name: Check import sorting with isort  
        run: |
          isort --check-only --diff .

      - name: Run type checking with mypy
        continue-on-error: true  # Don't fail on type errors initially
        run: |
          pip install types-pytest
          mypy toposheafx/ --ignore-missing-imports --no-strict-optional

      - name: Check for security issues with bandit
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r toposheafx/ -ll

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint radon

      - name: Run pylint
        continue-on-error: true
        run: |
          pylint toposheafx/ --exit-zero --output-format=colorized

      - name: Check code complexity
        run: |
          radon cc toposheafx/ -s -nb
          radon mi toposheafx/ -s

      - name: Generate complexity report
        run: |
          echo "## Code Complexity Report" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          radon cc toposheafx/ -s -nb >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY