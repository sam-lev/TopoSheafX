name: Lint

on:
  push:
    branches: [ "sam" ] # add "main" when needed
  pull_request:
    branches: [ "sam" ] # add "main" when needed

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: ruff check . #

