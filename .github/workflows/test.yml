# .github/workflows/test.yml
name: Tests

on:
  push:
    branches: [ "sam", "main" ]
  pull_request:
    branches: [ "sam", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.3.* --index-url https://download.pytorch.org/whl/cpu

      - name: Install torch-scatter and torch-geometric
        run: |
          TORCH=$(python -c "import torch; print(torch.__version__.split('+')[0])")
          echo "Installing torch-scatter for torch ${TORCH} (CPU)"
          pip install torch-scatter -f https://data.pyg.org/whl/torch-${TORCH}+cpu.html
          pip install torch-geometric

      - name: Install project and dependencies
        run: |
          pip install -e .
          pip install -r requirements.txt || echo "No requirements.txt found"
          pip install pytest pytest-cov pytest-xdist pytest-timeout

      - name: Run unit tests
        run: |
          pytest tests/ \
            -v \
            --cov=toposheafx \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junit-xml=test-results.xml \
            --timeout=300 \
            -n auto \
            -m "not slow and not gpu"

      - name: Run integration tests
        if: matrix.python-version == '3.11'
        run: |
          pytest tests/ \
            -v \
            -m integration \
            --timeout=600

      - name: Upload coverage reports
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            test-results.xml
            htmlcov/

      - name: Generate coverage badge
        if: matrix.python-version == '3.11'
        run: |
          coverage_percentage=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(f\"{float(root.attrib['line-rate']) * 100:.1f}\")")
          echo "Coverage: ${coverage_percentage}%"
          echo "COVERAGE=${coverage_percentage}" >> $GITHUB_ENV

      - name: Create coverage comment
        if: github.event_name == 'pull_request' && matrix.python-version == '3.11'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 85
          MINIMUM_ORANGE: 70