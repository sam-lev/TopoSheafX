name: Tests

on:
  push:
    branches: [ "sam" ] # add "main" when needed
  pull_request:
    branches: [ "sam" ] # add "main" when needed

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]   # adjust as needed
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt || true
          pip install pytest pytest-cov

      - name: Install PyTorch (CPU wheels)
        run: |
          python -m pip install --upgrade pip
          # pin or use the range you support; CPU wheels avoid CUDA hassles on GHA
          pip install "torch==2.3.*" --index-url https://download.pytorch.org/whl/cpu

      - name: Install torch-scatter (match the installed torch)
        run: |
          TORCH=$(python - <<'PY'
          import torch
          print(torch.__version__.split('+')[0])
          PY
          )
          echo "Installing torch-scatter for torch ${TORCH} (CPU)"
          pip install "torch-scatter>=2.1.0" -f https://data.pyg.org/whl/torch-${TORCH}+cpu.html

      - name: Install project + test deps
        run: |
          pip install -e . || true
          pip install -r requirements.txt || true
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=models \
            --cov=train \
            --cov=utils \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Verify coverage.xml exists
        run: |
          ls -l coverage.xml && head -n 3 coverage.xml

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}   # required for private or protected branches
          files: ./coverage.xml
          slug: sam-lev/TopoSheafX
          flags: unittests
          fail_ci_if_error: true
          verbose: true
