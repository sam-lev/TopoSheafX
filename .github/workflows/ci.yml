name: CMPNN CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PyTorch (first to satisfy torch-scatter build)
      run: |
        pip install torch torchvision torchaudio

    - name: Install PyG + other dependencies
      run: |
        pip install torch-scatter torch-sparse torch-cluster 
torch-spline-conv torch-geometric
        pip install pytest fsspec ogb pandas scikit-learn matplotlib

    - name: Run tests
      run: |
        pytest tests/

