name: CMPNN CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PyTorch (CPU-only)
      run: |
        pip install torch==2.2.2 torchvision==0.17.2 torchaudio==2.2.2 
--index-url https://download.pytorch.org/whl/cpu

    - name: Install PyG and dependencies
      run: |
        pip install pyg-lib torch-scatter torch-sparse torch-cluster 
torch-spline-conv torch-geometric -f 
https://data.pyg.org/whl/torch-2.2.2+cpu.html

    - name: Install project and test dependencies
      run: |
        pip install pytest fsspec ogb pandas scikit-learn matplotlib

    - name: Run tests
      run: |
        pytest tests/

