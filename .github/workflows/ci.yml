name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: "latest"
          environment-file:
            - config/cmpnn_environment.yml
            - config/torchgeometric.yml
          create-args: |
            python=${{ matrix.python-version }}
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Ensure minimal deps if no env files found
        if: ${{ !hashFiles('config/cmpnn_environment.yml') && !hashFiles('config/torchgeometric.yml') }}
        run: |
          micromamba install -y python=${{ matrix.python-version }} pip
          python -m pip install --upgrade pip
          # CPU wheels for torch
          python -m pip install "torch>=2.2,<2.4" --index-url https://download.pytorch.org/whl/cpu
          # PyG core + extensions
          python -m pip install torch-geometric
          python -c "import subprocess, sys, torch; ver = torch.__version__.split('+')[0]; base = f'https://data.pyg.org/whl/torch-{ver}+cpu.html'; \
          [subprocess.check_call([sys.executable, '-m', 'pip', 'install', pkg, '-f', base]) for pkg in ['torch-scatter', 'torch-sparse', 'torch-cluster', 'torch-spline-conv']]"
          python -m pip install pytest pytest-cov

      - name: Install package
        run: |
          python -m pip install -e .
          python -c "import torch, torch_geometric; print('torch', torch.__version__, 'pyg', getattr(torch_geometric, '__version__', 'n/a'))"

      - name: Run tests with coverage (XML + terminal)
        run: |
          # Respect pytest.ini AND also emit coverage.xml for Codecov
          pytest --cov=models --cov=train --cov-report=term-missing --cov-report=xml

      - name: Upload coverage.xml to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: true
          # For private repos, set this secret in your repo settings:
          # token: ${{ secrets.CODECOV_TOKEN }}
