# pytest.ini
[pytest]
minversion = 7.0

# Default CLI options for every run (local & CI)
addopts =
    -q
    --disable-warnings
    --maxfail=1
    --cov=models
    --cov=train
    --cov-report=term-missing

# Where to discover tests
testpaths =
    tests

# Naming conventions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Don’t recurse into non-test code/data
norecursedirs =
    .git
    .venv
    venv
    build
    dist
    data
    scripts
    config
    examples
    __pycache__

# Register common markers to avoid warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gpu: tests that require a CUDA-capable GPU
    integration: multi-module or end-to-end tests
    flaky: tests that occasionally fail; keep separate from unit tests

# Make xfail meaningful (xfail without a reason still shows as xfail)
xfail_strict = true

# Clean up noisy warnings from third-party deps
filterwarnings =
    ignore::UserWarning:torch.*:
    ignore::UserWarning:torch_geometric.*:
    ignore::DeprecationWarning:pkg_resources.*:
    ignore::DeprecationWarning:torch_sparse.*:

# Tell pytest-cov what to measure and to write coverage.xml for Codecov
# Adjust the "source" dirs to match your code layout.
# (You have models/, train/, utils/ per the tree.)
# You can also omit generated/third-party files with "omit".
[coverage:run]
source = models,train,utils
omit =
    */__init__.py
    */.venv/*
    */.mambaforge/*
    */site-packages/*

[coverage:report]
fail_under = 0
skip_covered = True
show_missing = True
