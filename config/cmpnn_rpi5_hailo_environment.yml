name: ctnn_rpi5
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy
  - scipy
  - matplotlib
  - networkx
  - scikit-learn
  - tqdm
  - pandas
  - h5py
  - cmake
  - ninja
  - cython
  - sympy
  - mpmath
  - pip:
      - torch==2.2.2+cpu  # Use torch compiled for ARM64 CPU if not using GPU
      - torch-geometric
      - torch-scatter
      - torch-sparse
      - torch-cluster
      - torch-spline-conv
      - torchmetrics
      - pot
      - einops
      - hailo-platform  # Assuming Hailo SDK is pip installable
